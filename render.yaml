services:
  - type: web
    name: prahari-osint-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PRAHARI_CORS_ORIGINS
        value: http://localhost:5173,https://prahari-osint.vercel.app
