services:
  - type: web
    name: prahari-osint-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PRAHARI_CORS_ORIGINS
        value: http://localhost:5173,https://hacka-xi.vercel.app,https://prahari-osint.vercel.app
      # Legacy shared token for scripts (acts as the SYSTEM admin account).
      - key: PRAHARI_API_TOKEN
        generateValue: true
      # Signs officer login sessions; without it every redeploy logs everyone out.
      - key: PRAHARI_JWT_SECRET
        generateValue: true
      # Ed25519 seed (base64). Set it in the dashboard: the free plan has no persistent disk,
      # so without it a new signing key is created on every deploy. See backend/README.md.
      - key: PRAHARI_SIGNING_KEY
        sync: false
