<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 358" width="100%" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#44506a"/></marker></defs><rect x="10" y="14" width="280" height="70" rx="8" fill="#f1f3f6" stroke="#8a94a6" stroke-width="1.6"/><text x="150.0" y="38.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b2433">0  BEFORE</text><text x="150.0" y="53.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b2433">warm backend (/api/health),</text><text x="150.0" y="68.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b2433">hard-refresh site, Simulation on</text><line x1="290" y1="49.0" x2="330" y2="49.0" stroke="#44506a" stroke-width="1.6" marker-end="url(#ar)"/><rect x="330" y="14" width="280" height="70" rx="8" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="1.6"/><text x="470.0" y="38.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b2433">1  LANDING</text><text x="470.0" y="53.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b2433">scroll once, click</text><text x="470.0" y="68.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b2433">LAUNCH COMMAND CENTER</text><line x1="610" y1="49.0" x2="650" y2="49.0" stroke="#44506a" stroke-width="1.6" marker-end="url(#ar)"/><rect x="650" y="14" width="280" height="70" rx="8" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="1.6"/><text x="790.0" y="38.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b2433">2  COMMAND CENTER</text><text x="790.0" y="53.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b2433">point at feed + map; say</text><text x="790.0" y="68.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b2433">&#x27;synthetic demo data&#x27;</text><path d="M 790.0 84 L 790.0 106 L 150.0 106 L 150.0 130" fill="none" stroke="#44506a" stroke-width="1.6" marker-end="url(#ar)"/><rect x="10" y="130" width="280" height="70" rx="8" fill="#e6f6ec" stroke="#1a9a52" stroke-width="1.6"/><text x="150.0" y="154.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b2433">3  CLICK a post</text><text x="150.0" y="169.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b2433">@border_drop_01: red slang,</text><text x="150.0" y="184.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b2433">identifier chips, &#x27;PDF Report&#x27;</text><line x1="290" y1="165.0" x2="330" y2="165.0" stroke="#44506a" stroke-width="1.6" marker-end="url(#ar)"/><rect x="330" y="130" width="280" height="70" rx="8" fill="#e6f6ec" stroke="#1a9a52" stroke-width="1.6"/><text x="470.0" y="154.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b2433">4  IMPORT INTEL</text><text x="470.0" y="169.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b2433">Raw Slang Scanner: paste the</text><text x="470.0" y="184.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b2433">mule-account ad, press scan</text><line x1="610" y1="165.0" x2="650" y2="165.0" stroke="#44506a" stroke-width="1.6" marker-end="url(#ar)"/><rect x="650" y="130" width="280" height="70" rx="8" fill="#e6f6ec" stroke="#1a9a52" stroke-width="1.6"/><text x="790.0" y="154.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b2433">5  ALERTS tab</text><text x="790.0" y="169.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b2433">open the HIGH alert,</text><text x="790.0" y="184.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b2433">read the &#x27;Why:&#x27; reasons</text><path d="M 790.0 200 L 790.0 222 L 150.0 222 L 150.0 246" fill="none" stroke="#44506a" stroke-width="1.6" marker-end="url(#ar)"/><rect x="10" y="246" width="280" height="70" rx="8" fill="#e6f6ec" stroke="#1a9a52" stroke-width="1.6"/><text x="150.0" y="270.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b2433">6  3D ENTITY TOPOLOGY</text><text x="150.0" y="285.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b2433">select @seller_raj -&gt;</text><text x="150.0" y="300.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b2433">channels linked in graph</text><line x1="290" y1="281.0" x2="330" y2="281.0" stroke="#44506a" stroke-width="1.6" marker-end="url(#ar)"/><rect x="330" y="246" width="280" height="70" rx="8" fill="#e6f6ec" stroke="#1a9a52" stroke-width="1.6"/><text x="470.0" y="270.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b2433">7  FORENSIC DOSSIER</text><text x="470.0" y="285.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b2433">open binder, read the digest;</text><text x="470.0" y="300.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b2433">export the PDF</text><line x1="610" y1="281.0" x2="650" y2="281.0" stroke="#44506a" stroke-width="1.6" marker-end="url(#ar)"/><rect x="650" y="246" width="280" height="70" rx="8" fill="#fff4d6" stroke="#c98a00" stroke-width="1.6"/><text x="790.0" y="270.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b2433">8  CLOSE</text><text x="790.0" y="285.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b2433">slide &#x27;Today vs Next&#x27;;</text><text x="790.0" y="300.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b2433">say the limits yourself</text><text x="10" y="342" text-anchor="start" font-size="11" fill="#44506a" font-weight="normal">Total about 3.5 minutes. Type the paste text beforehand in a note; do not improvise numbers.</text></svg>