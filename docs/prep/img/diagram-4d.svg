<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" width="100%" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#44506a"/></marker></defs><text x="10" y="20" text-anchor="start" font-size="14" fill="#1a9a52" font-weight="bold">TODAY (implemented)</text><text x="520" y="20" text-anchor="start" font-size="14" fill="#d64545" font-weight="bold">NEXT (planned, not in code)</text><rect x="10" y="36" width="440" height="50" rx="8" fill="#e6f6ec" stroke="#1a9a52" stroke-width="1.6"/><text x="230.0" y="57.333333333333336" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b2433">Raw post text</text><text x="230.0" y="73.33333333333334" text-anchor="middle" font-size="12" font-weight="normal" fill="#1b2433">exactly as captured</text><line x1="230" y1="86" x2="230" y2="102" stroke="#44506a" stroke-width="1.6" marker-end="url(#ar)"/><rect x="10" y="102" width="440" height="50" rx="8" fill="#e6f6ec" stroke="#1a9a52" stroke-width="1.6"/><text x="230.0" y="123.33333333333333" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b2433">SHA-256 digest</text><text x="230.0" y="139.33333333333331" text-anchor="middle" font-size="12" font-weight="normal" fill="#1b2433">of UTF-8 rawText only</text><line x1="230" y1="152" x2="230" y2="168" stroke="#44506a" stroke-width="1.6" marker-end="url(#ar)"/><rect x="10" y="168" width="440" height="50" rx="8" fill="#e6f6ec" stroke="#1a9a52" stroke-width="1.6"/><text x="230.0" y="189.33333333333334" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b2433">Captured-at UTC + source label</text><text x="230.0" y="205.33333333333334" text-anchor="middle" font-size="12" font-weight="normal" fill="#1b2433">server clock; source timestamp kept separately</text><line x1="230" y1="218" x2="230" y2="234" stroke="#44506a" stroke-width="1.6" marker-end="url(#ar)"/><rect x="10" y="234" width="440" height="50" rx="8" fill="#e6f6ec" stroke="#1a9a52" stroke-width="1.6"/><text x="230.0" y="255.33333333333334" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b2433">Alert ID from the digest</text><text x="230.0" y="271.33333333333337" text-anchor="middle" font-size="12" font-weight="normal" fill="#1b2433">ALRT-date-xxxx, stable across restarts</text><line x1="230" y1="284" x2="230" y2="300" stroke="#44506a" stroke-width="1.6" marker-end="url(#ar)"/><rect x="10" y="300" width="440" height="50" rx="8" fill="#e6f6ec" stroke="#1a9a52" stroke-width="1.6"/><text x="230.0" y="321.3333333333333" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b2433">PDF with digest + disclaimer</text><text x="230.0" y="337.3333333333333" text-anchor="middle" font-size="12" font-weight="normal" fill="#1b2433">&#x27;content digest, not a legal certificate&#x27;</text><rect x="520" y="36" width="440" height="50" rx="8" fill="#fdeaea" stroke="#d64545" stroke-width="1.6" stroke-dasharray="5,4"/><text x="740.0" y="57.333333333333336" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b2433">Hash chain</text><text x="740.0" y="73.33333333333334" text-anchor="middle" font-size="12" font-weight="normal" fill="#1b2433">each record hash includes the previous one</text><line x1="740" y1="86" x2="740" y2="102" stroke="#44506a" stroke-width="1.6" marker-end="url(#ar)"/><rect x="520" y="102" width="440" height="50" rx="8" fill="#fdeaea" stroke="#d64545" stroke-width="1.6" stroke-dasharray="5,4"/><text x="740.0" y="123.33333333333333" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b2433">Digital signature</text><text x="740.0" y="139.33333333333331" text-anchor="middle" font-size="12" font-weight="normal" fill="#1b2433">sign the chain head with a key</text><line x1="740" y1="152" x2="740" y2="168" stroke="#44506a" stroke-width="1.6" marker-end="url(#ar)"/><rect x="520" y="168" width="440" height="50" rx="8" fill="#fdeaea" stroke="#d64545" stroke-width="1.6" stroke-dasharray="5,4"/><text x="740.0" y="189.33333333333334" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b2433">Trusted timestamp</text><text x="740.0" y="205.33333333333334" text-anchor="middle" font-size="12" font-weight="normal" fill="#1b2433">RFC 3161 time-stamping authority</text><line x1="740" y1="218" x2="740" y2="234" stroke="#44506a" stroke-width="1.6" marker-end="url(#ar)"/><rect x="520" y="234" width="440" height="50" rx="8" fill="#fdeaea" stroke="#d64545" stroke-width="1.6" stroke-dasharray="5,4"/><text x="740.0" y="255.33333333333334" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b2433">Write-once store + audit log</text><text x="740.0" y="271.33333333333337" text-anchor="middle" font-size="12" font-weight="normal" fill="#1b2433">who viewed or exported what, when</text><line x1="740" y1="284" x2="740" y2="300" stroke="#44506a" stroke-width="1.6" marker-end="url(#ar)"/><rect x="520" y="300" width="440" height="50" rx="8" fill="#fdeaea" stroke="#d64545" stroke-width="1.6" stroke-dasharray="5,4"/><text x="740.0" y="321.3333333333333" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b2433">Verify button</text><text x="740.0" y="337.3333333333333" text-anchor="middle" font-size="12" font-weight="normal" fill="#1b2433">re-hash stored text and compare</text><line x1="450" y1="180" x2="520" y2="180" stroke="#44506a" stroke-width="1.6" marker-end="url(#ar)"/><text x="485.0" y="175.0" text-anchor="middle" font-size="10" fill="#44506a">extends</text><text x="10" y="382" text-anchor="start" font-size="11" fill="#44506a" font-weight="normal">Not provided today: authenticity of the source, chain of custody, signatures, tamper-proof storage, in-app re-verification.</text></svg>