<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 476" width="100%" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#44506a"/></marker></defs><text x="10" y="20" text-anchor="start" font-size="14" fill="#1a9a52" font-weight="bold">TODAY (in the code)</text><text x="520" y="20" text-anchor="start" font-size="14" fill="#d64545" font-weight="bold">NEXT (not built)</text><rect x="10" y="36" width="440" height="46" rx="8" fill="#e6f6ec" stroke="#1a9a52" stroke-width="1.6"/><text x="230.0" y="55.416666666666664" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1b2433">Raw post text</text><text x="230.0" y="70.91666666666666" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#1b2433">stored exactly as captured</text><line x1="230" y1="82" x2="230" y2="94" stroke="#44506a" stroke-width="1.6" marker-end="url(#ar)"/><rect x="10" y="94" width="440" height="46" rx="8" fill="#e6f6ec" stroke="#1a9a52" stroke-width="1.6"/><text x="230.0" y="113.41666666666667" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1b2433">SHA-256 content digest</text><text x="230.0" y="128.91666666666669" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#1b2433">of UTF-8 rawText only</text><line x1="230" y1="140" x2="230" y2="152" stroke="#44506a" stroke-width="1.6" marker-end="url(#ar)"/><rect x="10" y="152" width="440" height="46" rx="8" fill="#e6f6ec" stroke="#1a9a52" stroke-width="1.6"/><text x="230.0" y="171.41666666666666" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1b2433">Captured-at UTC + source label + platform</text><text x="230.0" y="186.91666666666666" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#1b2433">server clock; source timestamp kept separately</text><line x1="230" y1="198" x2="230" y2="210" stroke="#44506a" stroke-width="1.6" marker-end="url(#ar)"/><rect x="10" y="210" width="440" height="46" rx="8" fill="#e6f6ec" stroke="#1a9a52" stroke-width="1.6"/><text x="230.0" y="229.41666666666666" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1b2433">Duplicate check</text><text x="230.0" y="244.91666666666666" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#1b2433">same channel + text + time is not stored twice</text><line x1="230" y1="256" x2="230" y2="268" stroke="#44506a" stroke-width="1.6" marker-end="url(#ar)"/><rect x="10" y="268" width="440" height="46" rx="8" fill="#e6f6ec" stroke="#1a9a52" stroke-width="1.6"/><text x="230.0" y="287.4166666666667" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1b2433">Re-verify button</text><text x="230.0" y="302.9166666666667" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#1b2433">server re-hashes the stored text: match / mismatch</text><line x1="230" y1="314" x2="230" y2="326" stroke="#44506a" stroke-width="1.6" marker-end="url(#ar)"/><rect x="10" y="326" width="440" height="46" rx="8" fill="#e6f6ec" stroke="#1a9a52" stroke-width="1.6"/><text x="230.0" y="345.4166666666667" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1b2433">Hash-chained audit log</text><text x="230.0" y="360.9166666666667" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#1b2433">ingest, status, verify, export; chain check</text><line x1="230" y1="372" x2="230" y2="384" stroke="#44506a" stroke-width="1.6" marker-end="url(#ar)"/><rect x="10" y="384" width="440" height="46" rx="8" fill="#e6f6ec" stroke="#1a9a52" stroke-width="1.6"/><text x="230.0" y="403.4166666666667" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1b2433">PDF with digest + disclaimer</text><text x="230.0" y="418.9166666666667" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#1b2433">&#x27;content digest, not a legal certificate&#x27;</text><rect x="520" y="36" width="440" height="46" rx="8" fill="#fdeaea" stroke="#d64545" stroke-width="1.6" stroke-dasharray="5,4"/><text x="740.0" y="55.416666666666664" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1b2433">User logins</text><text x="740.0" y="70.91666666666666" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#1b2433">so the actor in the log is authenticated</text><line x1="740" y1="82" x2="740" y2="94" stroke="#44506a" stroke-width="1.6" marker-end="url(#ar)"/><rect x="520" y="94" width="440" height="46" rx="8" fill="#fdeaea" stroke="#d64545" stroke-width="1.6" stroke-dasharray="5,4"/><text x="740.0" y="113.41666666666667" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1b2433">Digital signature</text><text x="740.0" y="128.91666666666669" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#1b2433">sign the audit-log head with a key</text><line x1="740" y1="140" x2="740" y2="152" stroke="#44506a" stroke-width="1.6" marker-end="url(#ar)"/><rect x="520" y="152" width="440" height="46" rx="8" fill="#fdeaea" stroke="#d64545" stroke-width="1.6" stroke-dasharray="5,4"/><text x="740.0" y="171.41666666666666" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1b2433">Trusted timestamp</text><text x="740.0" y="186.91666666666666" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#1b2433">RFC 3161 time-stamping authority</text><line x1="740" y1="198" x2="740" y2="210" stroke="#44506a" stroke-width="1.6" marker-end="url(#ar)"/><rect x="520" y="210" width="440" height="46" rx="8" fill="#fdeaea" stroke="#d64545" stroke-width="1.6" stroke-dasharray="5,4"/><text x="740.0" y="229.41666666666666" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1b2433">Write-once / off-site copy</text><text x="740.0" y="244.91666666666666" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#1b2433">so the DB owner cannot rewrite history</text><line x1="740" y1="256" x2="740" y2="268" stroke="#44506a" stroke-width="1.6" marker-end="url(#ar)"/><rect x="520" y="268" width="440" height="46" rx="8" fill="#fdeaea" stroke="#d64545" stroke-width="1.6" stroke-dasharray="5,4"/><text x="740.0" y="287.4166666666667" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1b2433">Legal certificate step</text><text x="740.0" y="302.9166666666667" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#1b2433">Sec 63 BSA certificate by an officer</text><line x1="450" y1="407" x2="520" y2="291" stroke="#44506a" stroke-width="1.6" marker-end="url(#ar)"/><text x="486" y="366" text-anchor="middle" font-size="10" fill="#44506a" font-weight="normal">extends</text><text x="10" y="448" text-anchor="start" font-size="11" fill="#44506a" font-weight="normal">Tamper-EVIDENT, not tamper-proof: edits to old rows are detected; whoever owns the database could rebuild the whole chain.</text><text x="10" y="466" text-anchor="start" font-size="11" fill="#44506a" font-weight="normal">Does not prove who posted, when it was posted, or who captured it. Images are not stored, only their hashes and text.</text></svg>