<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 428" width="100%" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#44506a"/></marker></defs><rect x="10" y="20" width="170" height="56" rx="8" fill="#f1f3f6" stroke="#8a94a6" stroke-width="1.6"/><text x="95.0" y="44.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b2433">Public Telegram preview</text><text x="95.0" y="59.5" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b2433">t.me/s/&lt;channel&gt; (no login)</text><rect x="10" y="96" width="170" height="56" rx="8" fill="#f1f3f6" stroke="#8a94a6" stroke-width="1.6"/><text x="95.0" y="120.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b2433">CSV / JSON export</text><text x="95.0" y="135.5" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b2433">(Telegram Desktop export ok)</text><rect x="10" y="172" width="170" height="56" rx="8" fill="#f1f3f6" stroke="#8a94a6" stroke-width="1.6"/><text x="95.0" y="196.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b2433">Analyst pasted text</text><text x="95.0" y="211.5" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b2433">Raw Slang Scanner</text><rect x="10" y="248" width="170" height="56" rx="8" fill="#f1f3f6" stroke="#8a94a6" stroke-width="1.6"/><text x="95.0" y="272.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b2433">Screenshot / poster</text><text x="95.0" y="287.5" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b2433">PNG, JPG, WebP (max 8 MB)</text><rect x="230" y="20" width="230" height="320" rx="8" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="1.6"/><text x="345.0" y="184.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b2433"></text><text x="345" y="44" text-anchor="middle" font-size="13" fill="#1b2433" font-weight="bold">BROWSER  -  Vercel</text><text x="345" y="62" text-anchor="middle" font-size="11" fill="#44506a" font-weight="normal">React 18 + Vite + Tailwind</text><text x="345" y="77" text-anchor="middle" font-size="11" fill="#44506a" font-weight="normal">MapLibre map  -  jsPDF report</text><rect x="245" y="92" width="200" height="38" rx="8" fill="#e6f6ec" stroke="#1a9a52" stroke-width="1.6"/><text x="345.0" y="114.5" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#1b2433">Command Center (feed, map, live graph)</text><rect x="245" y="138" width="200" height="38" rx="8" fill="#e6f6ec" stroke="#1a9a52" stroke-width="1.6"/><text x="345.0" y="160.5" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#1b2433">3D Entity Topology</text><rect x="245" y="184" width="200" height="38" rx="8" fill="#e6f6ec" stroke="#1a9a52" stroke-width="1.6"/><text x="345.0" y="206.5" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#1b2433">Alerts: status, audit trail, export</text><rect x="245" y="230" width="200" height="38" rx="8" fill="#e6f6ec" stroke="#1a9a52" stroke-width="1.6"/><text x="345.0" y="252.5" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#1b2433">Forensic Dossier + re-verify + PDF</text><rect x="245" y="276" width="200" height="38" rx="8" fill="#e6f6ec" stroke="#1a9a52" stroke-width="1.6"/><text x="345.0" y="298.5" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#1b2433">Image tab: OCR in browser (tesseract.js)</text><rect x="540" y="20" width="250" height="320" rx="8" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="1.6"/><text x="665.0" y="184.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b2433"></text><text x="665" y="44" text-anchor="middle" font-size="13" fill="#1b2433" font-weight="bold">FastAPI  -  Render (free tier)</text><rect x="552" y="56" width="226" height="28" rx="8" fill="#fff4d6" stroke="#c98a00" stroke-width="1.6"/><text x="665.0" y="73.5" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#1b2433">telegram_scraper.py (public preview)</text><rect x="552" y="90" width="226" height="28" rx="8" fill="#e6f6ec" stroke="#1a9a52" stroke-width="1.6"/><text x="665.0" y="107.5" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#1b2433">classifier.py (232-term lexicon + rules)</text><rect x="552" y="124" width="226" height="28" rx="8" fill="#fff4d6" stroke="#c98a00" stroke-width="1.6"/><text x="665.0" y="141.5" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#1b2433">gemini_classifier.py (optional)</text><rect x="552" y="158" width="226" height="28" rx="8" fill="#e6f6ec" stroke="#1a9a52" stroke-width="1.6"/><text x="665.0" y="175.5" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#1b2433">extractor.py (phone, UPI, wallet...)</text><rect x="552" y="192" width="226" height="28" rx="8" fill="#e6f6ec" stroke="#1a9a52" stroke-width="1.6"/><text x="665.0" y="209.5" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#1b2433">graph_engine.py (custom, no NetworkX)</text><rect x="552" y="226" width="226" height="28" rx="8" fill="#e6f6ec" stroke="#1a9a52" stroke-width="1.6"/><text x="665.0" y="243.5" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#1b2433">analytics.py (risk + TF-IDF similarity)</text><rect x="552" y="260" width="226" height="28" rx="8" fill="#e6f6ec" stroke="#1a9a52" stroke-width="1.6"/><text x="665.0" y="277.5" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#1b2433">casework.py (status, audit log, verify)</text><rect x="552" y="294" width="226" height="28" rx="8" fill="#e6f6ec" stroke="#1a9a52" stroke-width="1.6"/><text x="665.0" y="311.5" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#1b2433">images.py (SHA-256 + dHash, Pillow)</text><rect x="840" y="20" width="140" height="70" rx="8" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="1.6"/><text x="910.0" y="44.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b2433">SQLite</text><text x="910.0" y="59.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b2433">prahari.db</text><text x="910.0" y="74.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b2433">ephemeral on free tier</text><rect x="840" y="120" width="140" height="70" rx="8" fill="#fdeaea" stroke="#d64545" stroke-width="1.6" stroke-dasharray="5,4"/><text x="910.0" y="144.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b2433">Gemini API</text><text x="910.0" y="159.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b2433">optional, user key</text><text x="910.0" y="174.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b2433">sent as header</text><rect x="840" y="220" width="140" height="50" rx="8" fill="#f1f3f6" stroke="#8a94a6" stroke-width="1.6"/><text x="910.0" y="241.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b2433">Newest 300 posts</text><text x="910.0" y="256.5" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b2433">in memory</text><rect x="840" y="290" width="140" height="50" rx="8" fill="#e6f6ec" stroke="#1a9a52" stroke-width="1.6"/><text x="910.0" y="311.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b2433">Audit log table</text><text x="910.0" y="326.5" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b2433">hash-chained, SQLite</text><line x1="180" y1="48" x2="230" y2="80" stroke="#44506a" stroke-width="1.6" marker-end="url(#ar)"/><line x1="180" y1="124" x2="230" y2="124" stroke="#44506a" stroke-width="1.6" marker-end="url(#ar)"/><line x1="180" y1="200" x2="230" y2="170" stroke="#44506a" stroke-width="1.6" marker-end="url(#ar)"/><line x1="180" y1="276" x2="230" y2="276" stroke="#44506a" stroke-width="1.6" marker-end="url(#ar)"/><line x1="460" y1="110" x2="540" y2="110" stroke="#44506a" stroke-width="1.6" marker-end="url(#ar)"/><text x="500" y="102" text-anchor="middle" font-size="10" fill="#44506a">REST /api/*</text><line x1="540" y1="160" x2="460" y2="160" stroke="#44506a" stroke-width="1.6" marker-end="url(#ar)"/><text x="500" y="178" text-anchor="middle" font-size="10" fill="#44506a">WebSocket /ws/stream</text><line x1="790" y1="55" x2="840" y2="55" stroke="#44506a" stroke-width="1.6" marker-end="url(#ar)"/><text x="815" y="48" text-anchor="middle" font-size="10" fill="#44506a">save</text><line x1="790" y1="155" x2="840" y2="155" stroke="#44506a" stroke-width="1.6" marker-end="url(#ar)" stroke-dasharray="5,4"/><text x="815" y="148" text-anchor="middle" font-size="10" fill="#44506a">if unsure</text><line x1="790" y1="245" x2="840" y2="245" stroke="#44506a" stroke-width="1.6" marker-end="url(#ar)"/><line x1="790" y1="315" x2="840" y2="315" stroke="#44506a" stroke-width="1.6" marker-end="url(#ar)"/><text x="10" y="368" text-anchor="start" font-size="11" fill="#44506a" font-weight="normal">Telegram scans are fetched by the backend; uploads, pasted text and screenshots go browser -&gt; backend. Images are not stored, only hashes + text.</text><text x="10" y="386" text-anchor="start" font-size="11" fill="#44506a" font-weight="normal">Frontend also has a simpler browser-side rule engine used only for the synthetic simulation and offline fallback.</text><rect x="10" y="404" width="16" height="12" rx="3" fill="#e6f6ec" stroke="#1a9a52" stroke-width="1.5"/><text x="32" y="414" text-anchor="start" font-size="11" fill="#44506a" font-weight="normal">implemented</text><rect x="160" y="404" width="16" height="12" rx="3" fill="#fff4d6" stroke="#c98a00" stroke-width="1.5"/><text x="182" y="414" text-anchor="start" font-size="11" fill="#44506a" font-weight="normal">partial</text><rect x="310" y="404" width="16" height="12" rx="3" fill="#fdeaea" stroke="#d64545" stroke-width="1.5"/><text x="332" y="414" text-anchor="start" font-size="11" fill="#44506a" font-weight="normal">planned / missing</text><rect x="460" y="404" width="16" height="12" rx="3" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="1.5"/><text x="482" y="414" text-anchor="start" font-size="11" fill="#44506a" font-weight="normal">infrastructure</text></svg>