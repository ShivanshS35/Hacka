<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 518" width="100%" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#44506a"/></marker></defs><rect x="10" y="10" width="260" height="44" rx="8" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="1.6"/><text x="140.0" y="28.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b2433">Post flagged</text><text x="140.0" y="43.5" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b2433">rule score &gt;= 0.70</text><rect x="10" y="80" width="360" height="50" rx="8" fill="#fff4d6" stroke="#c98a00" stroke-width="1.6"/><text x="190.0" y="101.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b2433">Rule score &gt;= 0.90 ?</text><text x="190.0" y="116.5" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b2433">+2   (else &gt;= 0.70: +1)</text><line x1="140" y1="54" x2="140" y2="80" stroke="#44506a" stroke-width="1.6" marker-end="url(#ar)"/><rect x="10" y="146" width="360" height="50" rx="8" fill="#fff4d6" stroke="#c98a00" stroke-width="1.6"/><text x="190.0" y="167.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b2433">More than one category ?</text><text x="190.0" y="182.5" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b2433">+1</text><line x1="190" y1="120" x2="190" y2="146" stroke="#44506a" stroke-width="1.6" marker-end="url(#ar)"/><rect x="10" y="212" width="360" height="50" rx="8" fill="#fff4d6" stroke="#c98a00" stroke-width="1.6"/><text x="190.0" y="233.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b2433">Contact / payment identifier present ?</text><text x="190.0" y="248.5" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b2433">+1  (UPI, phone, handle, wallet, bank a/c)</text><line x1="190" y1="186" x2="190" y2="212" stroke="#44506a" stroke-width="1.6" marker-end="url(#ar)"/><rect x="10" y="278" width="360" height="50" rx="8" fill="#fff4d6" stroke="#c98a00" stroke-width="1.6"/><text x="190.0" y="299.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b2433">Same identifier in 2+ channels ?</text><text x="190.0" y="314.5" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b2433">+2</text><line x1="190" y1="252" x2="190" y2="278" stroke="#44506a" stroke-width="1.6" marker-end="url(#ar)"/><rect x="10" y="344" width="360" height="50" rx="8" fill="#fff4d6" stroke="#c98a00" stroke-width="1.6"/><text x="190.0" y="365.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b2433">FINANCIAL post with bank a/c or UPI ?</text><text x="190.0" y="380.5" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b2433">+1</text><line x1="190" y1="318" x2="190" y2="344" stroke="#44506a" stroke-width="1.6" marker-end="url(#ar)"/><line x1="190" y1="394" x2="190" y2="410" stroke="#44506a" stroke-width="1.6" marker-end="url(#ar)"/><rect x="10" y="410" width="360" height="50" rx="8" fill="#e6f6ec" stroke="#1a9a52" stroke-width="1.6"/><text x="190.0" y="431.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b2433">Add the points (maximum 7)</text><text x="190.0" y="446.5" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b2433">every point has a text reason</text><line x1="370" y1="435" x2="470" y2="435" stroke="#44506a" stroke-width="1.6" marker-end="url(#ar)"/><rect x="470" y="120" width="220" height="56" rx="8" fill="#fdeaea" stroke="#d64545" stroke-width="1.6"/><text x="580.0" y="144.16666666666666" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b2433">HIGH</text><text x="580.0" y="161.16666666666666" text-anchor="middle" font-size="13" font-weight="normal" fill="#1b2433">5 or more</text><rect x="470" y="240" width="220" height="56" rx="8" fill="#fff4d6" stroke="#c98a00" stroke-width="1.6"/><text x="580.0" y="264.1666666666667" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b2433">MEDIUM</text><text x="580.0" y="281.1666666666667" text-anchor="middle" font-size="13" font-weight="normal" fill="#1b2433">3 or 4</text><rect x="470" y="360" width="220" height="56" rx="8" fill="#e6f6ec" stroke="#1a9a52" stroke-width="1.6"/><text x="580.0" y="384.1666666666667" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b2433">LOW</text><text x="580.0" y="401.1666666666667" text-anchor="middle" font-size="13" font-weight="normal" fill="#1b2433">0 to 2</text><path d="M 690 435 L 740 435 L 740 148 L 690 148" fill="none" stroke="#44506a" stroke-width="1.5" stroke-dasharray="4,3"/><text x="480" y="106" text-anchor="start" font-size="12" fill="#1b2433" font-weight="bold">Result (analytics.risk_for)</text><text x="10" y="488" text-anchor="start" font-size="11" fill="#44506a" font-weight="normal">Example: border-drop demo alert = strong match (+2) + identifier (+1) + identifier in 2+ channels (+2) = 5 = HIGH.</text><text x="10" y="506" text-anchor="start" font-size="11" fill="#44506a" font-weight="normal">Weights are judgement-based, not trained; they are a transparent triage aid, not a probability.</text></svg>