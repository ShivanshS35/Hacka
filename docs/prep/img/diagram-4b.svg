<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 416" width="100%" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#44506a"/></marker></defs><rect x="10" y="16" width="225" height="74" rx="8" fill="#e6f6ec" stroke="#1a9a52" stroke-width="1.6"/><text x="122.5" y="42.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b2433">1 INGEST</text><text x="122.5" y="57.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b2433">CSV / JSON, Telegram preview,</text><text x="122.5" y="72.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b2433">pasted text, screenshot (OCR)</text><rect x="245" y="16" width="225" height="74" rx="8" fill="#e6f6ec" stroke="#1a9a52" stroke-width="1.6"/><text x="357.5" y="42.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b2433">2 NORMALISE</text><text x="357.5" y="57.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b2433">Unicode + look-alike letters,</text><text x="357.5" y="72.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b2433">spaced digits, &#x27;(at)&#x27; UPIs</text><rect x="480" y="16" width="225" height="74" rx="8" fill="#e6f6ec" stroke="#1a9a52" stroke-width="1.6"/><text x="592.5" y="42.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b2433">3 LEXICON CLASSIFIER</text><text x="592.5" y="57.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b2433">232 terms, 4 categories; one</text><text x="592.5" y="72.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b2433">keyword needs a 2nd signal</text><rect x="715" y="16" width="225" height="74" rx="8" fill="#fff4d6" stroke="#c98a00" stroke-width="1.6"/><text x="827.5" y="42.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b2433">4 GEMINI 2nd OPINION</text><text x="827.5" y="57.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b2433">only if unsure + user key</text><text x="827.5" y="72.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b2433">falls back to rules</text><line x1="235" y1="53.0" x2="245" y2="53.0" stroke="#44506a" stroke-width="1.6" marker-end="url(#ar)"/><line x1="470" y1="53.0" x2="480" y2="53.0" stroke="#44506a" stroke-width="1.6" marker-end="url(#ar)"/><line x1="705" y1="53.0" x2="715" y2="53.0" stroke="#44506a" stroke-width="1.6" marker-end="url(#ar)"/><rect x="10" y="134" width="225" height="74" rx="8" fill="#e6f6ec" stroke="#1a9a52" stroke-width="1.6"/><text x="122.5" y="160.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b2433">5 EXTRACT + DIRECTION</text><text x="122.5" y="175.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b2433">phone, UPI, handle, wallet, bank,</text><text x="122.5" y="190.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b2433">IFSC, district; sell/buy/rent</text><rect x="245" y="134" width="225" height="74" rx="8" fill="#e6f6ec" stroke="#1a9a52" stroke-width="1.6"/><text x="357.5" y="160.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b2433">6 EVIDENCE RECORD</text><text x="357.5" y="175.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b2433">text, UTC time, channel,</text><text x="357.5" y="190.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b2433">platform, SHA-256; dedup</text><rect x="480" y="134" width="225" height="74" rx="8" fill="#e6f6ec" stroke="#1a9a52" stroke-width="1.6"/><text x="592.5" y="160.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b2433">7 STORE + AUDIT LOG</text><text x="592.5" y="175.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b2433">SQLite, WebSocket broadcast,</text><text x="592.5" y="190.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b2433">hash-chained audit entry</text><rect x="715" y="134" width="225" height="74" rx="8" fill="#e6f6ec" stroke="#1a9a52" stroke-width="1.6"/><text x="827.5" y="160.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b2433">8 ENTITY GRAPH</text><text x="827.5" y="175.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b2433">shared identifiers + similar</text><text x="827.5" y="190.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b2433">images link posts</text><line x1="235" y1="171.0" x2="245" y2="171.0" stroke="#44506a" stroke-width="1.6" marker-end="url(#ar)"/><line x1="470" y1="171.0" x2="480" y2="171.0" stroke="#44506a" stroke-width="1.6" marker-end="url(#ar)"/><line x1="705" y1="171.0" x2="715" y2="171.0" stroke="#44506a" stroke-width="1.6" marker-end="url(#ar)"/><rect x="10" y="252" width="225" height="74" rx="8" fill="#e6f6ec" stroke="#1a9a52" stroke-width="1.6"/><text x="122.5" y="278.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b2433">9 RISK SCORE</text><text x="122.5" y="293.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b2433">additive, reasons shown</text><text x="122.5" y="308.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b2433">LOW / MEDIUM / HIGH</text><rect x="245" y="252" width="225" height="74" rx="8" fill="#e6f6ec" stroke="#1a9a52" stroke-width="1.6"/><text x="357.5" y="278.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b2433">10 SIMILARITY</text><text x="357.5" y="293.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b2433">text: TF-IDF cosine &gt;= 0.65</text><text x="357.5" y="308.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b2433">image: dHash distance &lt;= 10</text><rect x="480" y="252" width="225" height="74" rx="8" fill="#e6f6ec" stroke="#1a9a52" stroke-width="1.6"/><text x="592.5" y="278.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b2433">11 ALERT DASHBOARD</text><text x="592.5" y="293.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b2433">status workflow, export,</text><text x="592.5" y="308.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b2433">dossier, re-verify, PDF</text><rect x="715" y="252" width="225" height="74" rx="8" fill="#fdeaea" stroke="#d64545" stroke-width="1.6" stroke-dasharray="5,4"/><text x="827.5" y="278.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b2433">NOT BUILT</text><text x="827.5" y="293.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b2433">trained ML model, logins,</text><text x="827.5" y="308.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b2433">signature, scheduled scans</text><line x1="235" y1="289.0" x2="245" y2="289.0" stroke="#44506a" stroke-width="1.6" marker-end="url(#ar)"/><line x1="470" y1="289.0" x2="480" y2="289.0" stroke="#44506a" stroke-width="1.6" marker-end="url(#ar)"/><line x1="705" y1="289.0" x2="715" y2="289.0" stroke="#44506a" stroke-width="1.6" marker-end="url(#ar)" stroke-dasharray="5,4"/><path d="M 825 90 L 825 112 L 120 112 L 120 134" fill="none" stroke="#44506a" stroke-width="1.6" marker-end="url(#ar)"/><path d="M 825 208 L 825 230 L 120 230 L 120 252" fill="none" stroke="#44506a" stroke-width="1.6" marker-end="url(#ar)"/><text x="10" y="372" text-anchor="start" font-size="11" fill="#44506a" font-weight="normal">Steps 9 and 10 run when the Alerts tab asks for them (GET /api/alerts, /api/coordinated), over the stored posts.</text><rect x="10" y="392" width="16" height="12" rx="3" fill="#e6f6ec" stroke="#1a9a52" stroke-width="1.5"/><text x="32" y="402" text-anchor="start" font-size="11" fill="#44506a" font-weight="normal">implemented</text><rect x="160" y="392" width="16" height="12" rx="3" fill="#fff4d6" stroke="#c98a00" stroke-width="1.5"/><text x="182" y="402" text-anchor="start" font-size="11" fill="#44506a" font-weight="normal">partial</text><rect x="310" y="392" width="16" height="12" rx="3" fill="#fdeaea" stroke="#d64545" stroke-width="1.5"/><text x="332" y="402" text-anchor="start" font-size="11" fill="#44506a" font-weight="normal">planned / missing</text><rect x="460" y="392" width="16" height="12" rx="3" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="1.5"/><text x="482" y="402" text-anchor="start" font-size="11" fill="#44506a" font-weight="normal">infrastructure</text></svg>