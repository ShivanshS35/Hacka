<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 376" width="100%" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#44506a"/></marker></defs><rect x="10" y="10" width="200" height="50" rx="8" fill="#fdeaea" stroke="#d64545" stroke-width="1.6"/><text x="110.0" y="39.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b2433">Demo step fails</text><line x1="210" y1="35" x2="260" y2="35" stroke="#44506a" stroke-width="1.6" marker-end="url(#ar)"/><rect x="260" y="10" width="220" height="50" rx="8" fill="#fff4d6" stroke="#c98a00" stroke-width="1.6"/><text x="370.0" y="39.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b2433">Backend slow? (cold start)</text><line x1="480" y1="35" x2="530" y2="35" stroke="#44506a" stroke-width="1.6" marker-end="url(#ar)"/><text x="505.0" y="30.0" text-anchor="middle" font-size="10" fill="#44506a">yes</text><rect x="530" y="10" width="420" height="50" rx="8" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="1.6"/><text x="740.0" y="31.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b2433">Wait up to 30 s, talk over the pipeline slide;</text><text x="740.0" y="46.5" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b2433">the header chip says &#x27;Python OSINT: online&#x27;</text><line x1="370" y1="60" x2="370" y2="100" stroke="#44506a" stroke-width="1.6" marker-end="url(#ar)"/><text x="370.0" y="75.0" text-anchor="middle" font-size="10" fill="#44506a">no</text><rect x="260" y="100" width="220" height="50" rx="8" fill="#fff4d6" stroke="#c98a00" stroke-width="1.6"/><text x="370.0" y="129.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b2433">Site or Vercel down?</text><line x1="480" y1="125" x2="530" y2="125" stroke="#44506a" stroke-width="1.6" marker-end="url(#ar)"/><text x="505.0" y="120.0" text-anchor="middle" font-size="10" fill="#44506a">yes</text><rect x="530" y="100" width="420" height="50" rx="8" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="1.6"/><text x="740.0" y="121.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b2433">Run locally: npm run dev + uvicorn</text><text x="740.0" y="136.5" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b2433">(commands pinned in a note)</text><line x1="370" y1="150" x2="370" y2="190" stroke="#44506a" stroke-width="1.6" marker-end="url(#ar)"/><text x="370.0" y="165.0" text-anchor="middle" font-size="10" fill="#44506a">no</text><rect x="260" y="190" width="220" height="50" rx="8" fill="#fff4d6" stroke="#c98a00" stroke-width="1.6"/><text x="370.0" y="219.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b2433">Wi-Fi down / anything else</text><line x1="480" y1="215" x2="530" y2="215" stroke="#44506a" stroke-width="1.6" marker-end="url(#ar)"/><text x="505.0" y="210.0" text-anchor="middle" font-size="10" fill="#44506a">yes</text><rect x="530" y="190" width="420" height="50" rx="8" fill="#e6f6ec" stroke="#1a9a52" stroke-width="1.6"/><text x="740.0" y="211.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b2433">Play the backup video (recorded earlier,</text><text x="740.0" y="226.5" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b2433">on the laptop, no network)</text><line x1="740" y1="240" x2="740" y2="280" stroke="#44506a" stroke-width="1.6" marker-end="url(#ar)"/><rect x="530" y="280" width="420" height="56" rx="8" fill="#e6f6ec" stroke="#1a9a52" stroke-width="1.6"/><text x="740.0" y="304.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b2433">Still stuck after 30 s: show offline screenshots</text><text x="740.0" y="319.5" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b2433">(this guide + the deck) and keep talking</text><rect x="10" y="100" width="200" height="130" rx="8" fill="#f1f3f6" stroke="#8a94a6" stroke-width="1.6"/><text x="110.0" y="139.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b2433">Pre-demo kit</text><text x="110.0" y="154.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b2433">backup MP4 on desktop</text><text x="110.0" y="169.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b2433">screenshots in the deck</text><text x="110.0" y="184.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b2433">local run commands</text><text x="110.0" y="199.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b2433">UptimeRobot on /api/health</text><text x="10" y="360" text-anchor="start" font-size="12" fill="#1b2433" font-weight="bold">Rule: decide within 30 seconds. A calm switch to the video scores better than a long debug.</text></svg>